<div style="font-family: sans-serif; color: #1C1B1F; line-height: 1.5;">
  <p><b>開啟 PDF：</b>使用檔案選擇器從您的裝置或雲端儲存空間選取 PDF 檔案。</p>
  <p><b>範例 PDF：</b>下載並試用應用程式提供的範例 PDF 檔案以測試各項功能。</p>
  <p><b>選單：</b>點擊螢幕以切換工具列和滑桿的顯示狀態。</p>
  <p><b>頁面導覽：</b>透過滑動、使用滑桿或點擊左右邊緣（在桌面/滑鼠導覽模式下）來切換頁面。</p>
  <p><b>PDF 目次（大綱）：</b>點擊上方工具檢視書籤/章節並立即跳至任何章節。</p>
  <p><b>適應性佈局：</b>針對平板電腦、大螢幕和摺疊裝置自動優化。</p>
  <p><b>縮放：</b>雙指縮放。長按並拖動以在縮放時捲動。</p>
  <p><b>搜尋：</b>在搜尋列中輸入文字以尋找 PDF 中的特定內容。</p>
  <p><b>設定：</b>在設定畫面中自訂顯示設定並檢視文件/應用程式資訊。</p>
</div>
