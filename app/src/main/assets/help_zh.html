<div style="font-family: sans-serif; color: #1C1B1F; line-height: 1.5;">
  <p><b>打开 PDF：</b>使用文件选择器从设备或云存储中选择 PDF 文件。</p>
  <p><b>示例文档：</b>下载并试用应用提供的示例 PDF 文件。</p>
  <p><b>菜单：</b>点击屏幕以切换工具栏和滑块的可见性。</p>
  <p><b>页面导航：</b>通过滑动、使用滑块或点击左右边缘来切换页面。</p>
  <p><b>PDF 目录（大纲）：</b>点击顶部工具栏的目录图标以查看文档书签/章节并跳转。</p>
  <p><b>自适应布局：</b>针对平板电脑、大屏和折叠屏设备自动优化。</p>
  <p><b>缩放：</b>双指缩放。长按并拖动以在缩放时滚动。</p>
  <p><b>搜索：</b>在搜索栏中输入文本以查找 PDF 中的特定内容。</p>
  <p><b>设置：</b>自定义显示设置并查看文档/应用信息。</p>
</div>
